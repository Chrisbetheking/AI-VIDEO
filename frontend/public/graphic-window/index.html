<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>图文窗口 - AI VIDEO</title>
<style>
:root{--bg:#f6f4ff;--card:#fff;--ink:#111827;--muted:#64748b;--line:#e5e7eb;--brand:#7c3aed;--blue:#2563eb;--green:#16a34a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#faf7ff,#f8fbff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
header{height:68px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 8px 24px rgba(15,23,42,.18)}
header h1{margin:0;font-size:22px}.back{color:#dbeafe;text-decoration:none;font-weight:900}
main{max-width:1380px;margin:0 auto;padding:24px}.hero{background:#fff;border:1px solid #eadcff;border-radius:26px;padding:22px 24px;margin-bottom:20px;box-shadow:0 14px 36px rgba(124,58,237,.08)}
.hero b{color:var(--brand);letter-spacing:.16em}.hero h2{margin:8px 0 6px;font-size:28px}.hero p{margin:0;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:430px 1fr;gap:20px}.card{background:var(--card);border:1px solid #eadcff;border-radius:24px;padding:20px;box-shadow:0 16px 42px rgba(15,23,42,.07)}
label{display:block;margin:13px 0;font-weight:900;color:#334155}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:15px;padding:12px 14px;font-size:15px;background:#f8fafc;outline:none}
input:focus,select:focus,textarea:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.15)}textarea{min-height:108px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}button,.downloadBtn{border:0;border-radius:15px;padding:12px 16px;font-weight:950;cursor:pointer;background:#111827;color:white;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button.primary{background:var(--blue)}button.green{background:var(--green)}button:disabled{opacity:.55;cursor:not-allowed}.downloadBtn{background:#7c3aed}
pre{white-space:pre-wrap;background:#0f172a;color:#dbeafe;border-radius:16px;padding:14px;max-height:300px;overflow:auto;font-size:13px}.hint{background:#eff6ff;border:1px dashed #93c5fd;border-radius:15px;padding:12px;color:#1d4ed8;font-weight:800;margin:12px 0}
.resultTitle{font-size:22px;font-weight:950;margin:4px 0 10px}.images{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}.thumb{display:block;text-decoration:none;color:#111827;background:#f8fafc;border:1px solid #e5e7eb;border-radius:18px;padding:10px;box-shadow:0 10px 26px rgba(15,23,42,.08)}
.thumb img{width:100%;height:310px;object-fit:cover;border-radius:14px;background:#111827}.thumb span{display:block;margin-top:8px;font-size:13px;font-weight:900;color:#475569}
.badge{display:inline-block;background:#dcfce7;color:#166534;padding:7px 11px;border-radius:999px;font-weight:950;font-size:13px}.empty{min-height:420px;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-weight:900;border:2px dashed #e5e7eb;border-radius:20px;background:#fafafa}
@media(max-width:960px){.grid{grid-template-columns:1fr}.images{grid-template-columns:1fr}.thumb img{height:auto}}
</style>
</head>
<body>
<header>
  <h1>图文窗口</h1>
  <a class="back" href="/">返回主控制台</a>
</header>

<main>
  <section class="hero">
    <b>AI-VIDEO GRAPHIC WINDOW</b>
    <h2>9:16视频封面 / 小红书爆款图文包</h2>
    <p>不调用 FAL，不重新生成视频。视频封面一次生成3套9:16候选（数字型、避坑型、结果型）；小红书生成 7 页图文包，包含钩子、区域逻辑、对比表、预算分层、避坑和引流。</p>
  </section>

  <section class="grid">
    <div class="card">
      <h2>控制台</h2>
      <div class="hint">先点「读取最新成片」，再生成3套9:16封面或小红书7页图文包。</div>

      <label>视频 Job ID
        <input id="jobId" placeholder="留空时可读取最新成片"/>
      </label>

      <label>标题
        <input id="title" value="吉隆坡买房预算不同区域不同"/>
      </label>

      <label>关键词
        <input id="keywords" value="吉隆坡,买房,预算,投资,自住,出租回报,生活配套"/>
      </label>

      <label>目标平台
        <select id="platform">
          <option value="xiaohongshu">小红书</option>
          <option value="douyin">抖音</option>
          <option value="tiktok">TikTok</option>
          <option value="wechat">朋友圈/视频号</option>
        </select>
      </label>

      <label>风格
        <select id="style">
          <option>专业顾问</option>
          <option>小红书种草</option>
          <option>犀利避坑</option>
          <option>投资分析</option>
        </select>
      </label>

      <label>图片数量
        <input id="slideCount" type="number" min="3" max="9" value="7"/>
      </label>

      <label>引流 CTA
        <textarea id="cta">评论区告诉我预算和用途，我按你的需求拆解区域</textarea>
      </label>

      <div class="row">
        <button onclick="loadLatest()">读取最新成片</button>
        <button class="primary" onclick="makeCover()">生成3套9:16视频封面</button>
        <button class="green" onclick="makeXhs()">生成小红书爆款图文包</button>
      </div>

      <h3>日志</h3>
      <pre id="log">准备就绪</pre>
    </div>

    <div class="card">
      <h2>输出结果 <span class="badge">无 iframe 版</span></h2>
      <div id="output" class="empty">还没有生成图片</div>
    </div>
  </section>
</main>

<script>
const API_BASE = 'https://ai-video.47-76-143-158.sslip.io'
const $ = id => document.getElementById(id)

function log(x){
  $('log').textContent = typeof x === 'string' ? x : JSON.stringify(x,null,2)
}

function setBusy(on){
  document.querySelectorAll('button').forEach(b => b.disabled = !!on)
}

function payload(){
  return {
    job_id: $('jobId').value.trim(),
    title: $('title').value.trim(),
    script_text: "",
    keywords: $('keywords').value.split(/[,，\s]+/).map(x=>x.trim()).filter(Boolean),
    platform: $('platform').value,
    style: $('style').value,
    slide_count: Number($('slideCount').value || 7),
    cta: $('cta').value.trim(),
    use_video_frame: true
  }
}

async function api(path, body, method='POST'){
  const res = await fetch(API_BASE + path, {
    method,
    headers: body ? {'Content-Type':'application/json'} : undefined,
    body: body ? JSON.stringify(body) : undefined
  })
  const text = await res.text()
  let data
  try{ data = text ? JSON.parse(text) : {} }catch{ data = {raw:text} }
  if(!res.ok) throw new Error(data.detail || data.message || JSON.stringify(data).slice(0,500))
  return data
}

function render(data){
  log(data)
  const imgs = data.images || []
  let html = `<div class="resultTitle">${data.mode === 'video_cover' ? '视频封面结果' : '小红书图文结果'}</div>`
  html += `<p><b>标题：</b>${data.publish_title || data.title || ''}</p>`
  html += `<textarea readonly style="min-height:170px">${data.publish_description || ''}</textarea>`
  if(data.download_zip_url){
    html += `<p><a class="downloadBtn" href="${data.download_zip_url}" target="_blank">下载全部图片</a></p>`
  }
  html += `<div class="images">`
  for(const img of imgs){
    html += `<a class="thumb" href="${img.url}" target="_blank"><img src="${img.url}"/><span>${img.role || '图片'}</span></a>`
  }
  html += `</div>`
  $('output').className = ''
  $('output').innerHTML = html
}

async function loadLatest(){
  try{
    setBusy(true)
    log('读取最新成片中...')
    const data = await api('/api/graphic-window/latest-video-job', null, 'GET')
    $('jobId').value = data.job_id || ''
    if(data.title) $('title').value = data.title
    render(data)
  }catch(e){ log('失败：' + e.message) }
  finally{ setBusy(false) }
}

async function makeCover(){
  try{
    setBusy(true)
    log('生成3套9:16视频封面中...')
    const data = await api('/api/graphic-window/video-cover/generate', payload())
    render(data)
  }catch(e){ log('失败：' + e.message) }
  finally{ setBusy(false) }
}

async function makeXhs(){
  try{
    setBusy(true)
    log('生成小红书爆款图文包中...')
    const data = await api('/api/graphic-window/xiaohongshu/generate', payload())
    render(data)
  }catch(e){ log('失败：' + e.message) }
  finally{ setBusy(false) }
}
</script>

<style>
.reviewGatePanel{
  max-width:1380px;
  margin:0 auto 20px;
  padding:0;
}
.reviewGateCard{
  background:#fff;
  border:1px solid #eadcff;
  border-radius:24px;
  padding:20px 22px;
  box-shadow:0 16px 42px rgba(15,23,42,.07);
}
.reviewGateHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
}
.reviewGateHead h2{margin:0;font-size:22px}
.reviewGateBadge{
  display:inline-flex;
  align-items:center;
  padding:7px 12px;
  border-radius:999px;
  font-weight:950;
  font-size:13px;
  background:#f1f5f9;
  color:#475569;
}
.reviewGateBadge.pending{background:#fef3c7;color:#92400e}
.reviewGateBadge.failed,.reviewGateBadge.rejected{background:#fee2e2;color:#b91c1c}
.reviewGateBadge.approved{background:#dcfce7;color:#166534}
.reviewGateGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;

}

  border:1px solid #e5e7eb;

  border-radius:16px;
  padding:14px;
  min-height:110px;
}
.reviewGateBox b{display:block;margin-bottom:8px}

  display:flex;
  gap:10px;
  flex-wrap:wrap;

}

  color:#fff;
}
.reviewRun{background:#2563eb}

  margin:8px 0 0;
  padding-left:20px;
  color:#475569;
  line-height:1.75;
}

  color:#64748b;
  font-weight:700;
  margin:8px 0 0;
}
@media(max-width:900px){

<script>
(function(){
  const REVIEW_API_BASE = (typeof API_BASE !== 'undefined' && API_BASE)
    ? API_BASE
    : 'https://ai-video.47-76-143-158.sslip.io'

  let currentReview = null

  function escapeHtml(value){
    return String(value == null ? '' : value)
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'",'&#039;')
  }

  function reviewJobId(){
    const el = document.getElementById('jobId')
    return el ? el.value.trim() : ''
  }

  async function reviewFetch(path, body, method='POST'){
    const res = await fetch(REVIEW_API_BASE + path, {
      method,
      headers: body ? {'Content-Type':'application/json'} : undefined,
      body: body ? JSON.stringify(body) : undefined
    })
    const text = await res.text()
    let data = {}
    try{ data = text ? JSON.parse(text) : {} }catch{ data = {raw:text} }
    if(!res.ok){
      throw new Error(data.detail || data.message || data.error || text || `HTTP ${res.status}`)
    }
    return data
  }

  function packageButtons(){
    return [
      document.querySelector('button[onclick="makeCover()"]'),
      document.querySelector('button[onclick="makeXhs()"]')
    ].filter(Boolean)
  }

  function setPackagingEnabled(enabled){
    packageButtons().forEach(btn => {
      btn.disabled = !enabled
      btn.title = enabled ? '' : '视频尚未人工通过审查'
    })
  }

  function normalizedStatus(report){
    const status = String(report?.status || 'not_reviewed')
    if(status === 'review_pending_human') return 'pending'
    if(status === 'review_failed') return 'failed'
    return status
  }

  function statusText(report){
    const status = String(report?.status || 'not_reviewed')
    const map = {
      not_reviewed:'尚未审查',
      reviewing:'自动审查中',
      review_pending_human:'自动检查通过 等待人工确认',
      review_failed:'自动检查发现问题',
      approved:'已通过 已解锁封面',
      rejected:'已退回修改',
      review_error:'审查异常'
    }
    return map[status] || status
  }

  function issueText(issue){
    const start = Number(issue?.start || 0)
    const end = Number(issue?.end || 0)
    const range = end > start ? `${start.toFixed(1)}s-${end.toFixed(1)}s ` : ''
    return `${range}${issue?.description || issue?.detail || issue?.type || '未描述问题'}`
  }

  function renderReview(report){
    currentReview = report || {}
    const badge = document.getElementById('reviewGateBadge')
    const summary = document.getElementById('reviewGateSummary')
    const score = document.getElementById('reviewGateScore')
    const issues = document.getElementById('reviewGateIssues')
    const approved = report?.status === 'approved' &&
      report?.approved === true &&
      report?.packaging_unlocked === true

    if(badge){
      badge.className = 'reviewGateBadge ' + normalizedStatus(report)
      badge.textContent = statusText(report)
    }
    if(summary){
      summary.textContent = report?.summary ||
        (report?.status === 'not_reviewed'
          ? '视频生成完成后必须先审查，未通过时不会生成封面和小红书图文。'
          : '等待审查结果')
    }
    if(score){
      const machine = report?.mechanical?.score
      const ai = report?.ai_review?.score
      score.textContent = `综合 ${report?.overall_score ?? '-'} / 机械 ${machine ?? '-'} / 豆包 ${ai ?? '-'}`
    }
    if(issues){
      const list = Array.isArray(report?.issues) ? report.issues : []
      issues.innerHTML = list.length
        ? list.slice(0,12).map(x => `<li>${escapeHtml(issueText(x))}</li>`).join('')
        : '<li>暂未发现问题或尚未执行审查</li>'
    }

    setPackagingEnabled(approved)

    if(report?.status === 'reviewing'){
      window.clearTimeout(window.__aiVideoReviewPollTimer)
      window.__aiVideoReviewPollTimer = window.setTimeout(window.refreshVideoReview, 5000)
    }

    const approveBtn = document.getElementById('reviewApproveBtn')
    if(approveBtn){
      approveBtn.disabled = report?.status !== 'review_pending_human'
      approveBtn.title = approveBtn.disabled
        ? '自动审查通过后才能人工批准'
        : ''
    }
  }

  function ensurePanel(){
    if(document.getElementById('reviewGatePanel')) return
    const hero = document.querySelector('.hero')
    const main = document.querySelector('main')
    const panel = document.createElement('section')
    panel.id = 'reviewGatePanel'
    panel.className = 'reviewGatePanel'
    panel.innerHTML = `
      <div class="reviewGateCard">
        <div class="reviewGateHead">
          <h2>视频审查闸门</h2>
          <span id="reviewGateBadge" class="reviewGateBadge">尚未审查</span>
        </div>
        <p class="reviewGateHint">视频生成完成 → 机械质检 → 豆包审片 → 人工确认 → 自动生成9:16封面。未通过时封面和图文按钮保持锁定。</p>
        <div class="reviewGateGrid">
          <div class="reviewGateBox">
            <b>审查结论</b>
            <div id="reviewGateSummary">请选择或读取一个已完成的视频任务</div>
            <div id="reviewGateScore" style="margin-top:10px;font-weight:900;color:#475569">综合 - / 机械 - / 豆包 -</div>
          </div>
          <div class="reviewGateBox">
            <b>发现的问题</b>
            <ul id="reviewGateIssues" class="reviewGateIssues"><li>尚未执行审查</li></ul>
          </div>
        </div>
        <div class="reviewGateActions">
          <button class="reviewRun" onclick="runVideoReview()">自动审查视频</button>
          <button id="reviewApproveBtn" class="reviewApprove" onclick="approveVideoAndMakeCover()" disabled>通过并生成3套9:16封面</button>
<button
  id="reviewOverrideBtn"
  class="reviewRun"
  type="button"
  disabled
>确认是误报并生成3套9:16封面</button>
          <button class="reviewReject" onclick="rejectVideoReview()">退回修改</button>
        </div>
      </div>`
    if(hero && hero.parentNode){
      hero.insertAdjacentElement('afterend', panel)
    }else if(main){
      main.prepend(panel)
    }else{
      document.body.prepend(panel)
    }
  }

  window.refreshVideoReview = async function(){
    ensurePanel()
    const jobId = reviewJobId()
    if(!jobId){
      renderReview({status:'not_reviewed'})
      return
    }
    try{
      const data = await reviewFetch(`/api/video/review/${encodeURIComponent(jobId)}`, null, 'GET')
      renderReview(data)
    }catch(e){
      renderReview({status:'review_error', summary:'读取审查状态失败：' + e.message})
    }
  }

  window.runVideoReview = async function(){
    const jobId = reviewJobId()
    if(!jobId){
      alert('请先读取最新成片或填写 Job ID')
      return
    }
    ensurePanel()
    renderReview({status:'reviewing', summary:'正在执行机械质检和豆包视频理解审查'})
    try{
      const data = await reviewFetch(
        `/api/video/review/${encodeURIComponent(jobId)}/run`,
        {force_ai:true, force:true}
      )
      renderReview(data)
      if(typeof log === 'function') log(data)
    }catch(e){
      renderReview({status:'review_error', summary:'审查失败：' + e.message})
      if(typeof log === 'function') log('审查失败：' + e.message)
    }
  }

  window.approveVideoAndMakeCover = async function(){
    const jobId = reviewJobId()
    if(!jobId) return
    const titleEl = document.getElementById('title')
    const keywordsEl = document.getElementById('keywords')
    const styleEl = document.getElementById('style')
    const ctaEl = document.getElementById('cta')
    try{
      const data = await reviewFetch(
        `/api/video/review/${encodeURIComponent(jobId)}/approve`,
        {
          reviewer:'human',
          generate_cover:true,
          title:titleEl?.value || '',
          keywords:(keywordsEl?.value || '').split(/[,，\s]+/).filter(Boolean),
          style:styleEl?.value || '专业顾问',
          cta:ctaEl?.value || ''
        }
      )
      renderReview(data.review || data)
      if(data.cover_result && typeof render === 'function'){
        render(data.cover_result)
      }
      if(typeof log === 'function') log(data)
    }catch(e){
      alert('无法通过审查：' + e.message)
      if(typeof log === 'function') log('无法通过审查：' + e.message)
    }
  }

  window.rejectVideoReview = async function(){
    const jobId = reviewJobId()
    if(!jobId) return
    const reason = prompt('填写退回原因', '字幕或画面仍需修改')
    if(reason === null) return
    try{
      const data = await reviewFetch(
        `/api/video/review/${encodeURIComponent(jobId)}/reject`,
        {reviewer:'human', reason}
      )
      renderReview(data)
      if(typeof log === 'function') log(data)
    }catch(e){
      alert('退回失败：' + e.message)
    }
  }

  window.addEventListener('DOMContentLoaded', function(){
    ensurePanel()
    setPackagingEnabled(false)

    if(typeof window.loadLatest === 'function'){
      const originalLoadLatest = window.loadLatest
      window.loadLatest = async function(){
        const result = await originalLoadLatest.apply(this, arguments)
        await window.refreshVideoReview()
        return result
      }
    }

    const jobInput = document.getElementById('jobId')
    if(jobInput){
      jobInput.addEventListener('change', window.refreshVideoReview)
      if(jobInput.value.trim()) window.refreshVideoReview()
    }
  })
})()
</script>

<script id="aiVideoHumanOverridePatchV10351">
/* AI_VIDEO_HUMAN_OVERRIDE_UI_PATCH_V10_35_1 */
(function(){
  'use strict'

  const state = {
    report: null,
    originalApprove: null,
    renderHooked: false,
    lastJobId: '',
    lastFetchAt: 0,
    busy: false
  }

  function byId(id){
    return document.getElementById(id)
  }

  function getJobId(){
    try{
      if(typeof window.reviewJobId === 'function'){
        const value = String(window.reviewJobId() || '').trim()
        if(value) return value
      }
    }catch(_){}

    const ids = [
      'jobId',
      'videoJobId',
      'reviewJobId',
      'graphicJobId',
      'currentJobId'
    ]

    for(const id of ids){
      const el = byId(id)
      const value = String(el?.value || el?.textContent || '').trim()
      if(value) return value
    }

    return ''
  }

  function normalizeReport(data){
    if(data && typeof data === 'object' && data.review){
      return data.review
    }
    return data && typeof data === 'object' ? data : {}
  }

  function aiIssues(report){
    const value = report?.ai_review?.issues
    return Array.isArray(value)
      ? value.filter(item => item && typeof item === 'object')
      : []
  }

  function eligibleForOverride(report){
    const mechanicalPassed = report?.mechanical?.passed === true
    const hasAiIssues = aiIssues(report).length > 0
    const status = String(report?.status || '')
    return mechanicalPassed &&
      hasAiIssues &&
      ['review_pending_human', 'review_failed', 'rejected'].includes(status)
  }

  function updateButtons(report){
    if(report && typeof report === 'object'){
      state.report = report
    }

    const current = state.report || {}
    const hasAiIssues = aiIssues(current).length > 0
    const status = String(current.status || '')
    const mechanicalPassed = current?.mechanical?.passed === true

    const approveBtn = byId('reviewApproveBtn')
    if(approveBtn){
      approveBtn.disabled =
        status !== 'review_pending_human' || hasAiIssues || !mechanicalPassed
      approveBtn.title = hasAiIssues
        ? '豆包存在提示。人工确认画面实际正常时，请使用“确认是误报并生成3套9:16封面”。'
        : ''
    }

    const overrideBtn = byId('reviewOverrideBtn')
    if(overrideBtn){
      overrideBtn.disabled = !eligibleForOverride(current) || state.busy
      overrideBtn.title = overrideBtn.disabled
        ? '仅在机械检查通过且豆包存在问题提示时可使用'
        : '请完整观看对应时间段，确认属于误报后再点击'
    }
  }

  async function api(path, options){
    const response = await fetch(path, {
      credentials: 'same-origin',
      ...(options || {})
    })

    let data = {}
    try{
      data = await response.json()
    }catch(_){
      data = {raw: await response.text()}
    }

    if(!response.ok){
      const detail =
        data?.detail ||
        data?.message ||
        data?.error ||
        data?.raw ||
        `HTTP ${response.status}`
      throw new Error(
        typeof detail === 'string'
          ? detail
          : JSON.stringify(detail)
      )
    }

    return data
  }

  async function fetchReview(force){
    const jobId = getJobId()
    if(!jobId){
      updateButtons({})
      return null
    }

    const now = Date.now()
    if(
      !force &&
      state.lastJobId === jobId &&
      now - state.lastFetchAt < 1200
    ){
      return state.report
    }

    const data = await api(
      `/api/video/review/${encodeURIComponent(jobId)}`
    )
    state.lastJobId = jobId
    state.lastFetchAt = now
    const report = normalizeReport(data)
    updateButtons(report)
    return report
  }

  function hookRenderReview(){
    if(state.renderHooked) return

    const original = window.renderReview
    if(typeof original !== 'function') return
    if(original.__aiHumanOverrideWrapped){
      state.renderHooked = true
      return
    }

    const wrapped = function(report){
      const result = original.apply(this, arguments)
      try{
        updateButtons(normalizeReport(report))
      }catch(_){}
      return result
    }

    wrapped.__aiHumanOverrideWrapped = true
    window.renderReview = wrapped
    state.renderHooked = true
  }

  async function safeNormalApprove(){
    try{
      const report = await fetchReview(true)
      if(aiIssues(report || {}).length > 0){
        alert(
          '豆包仍有问题提示。若你已完整观看并确认画面实际正常，' +
          '请点击“确认是误报并生成3套9:16封面”。'
        )
        return
      }
    }catch(error){
      alert('读取审查状态失败：' + error.message)
      return
    }

    if(typeof state.originalApprove === 'function'){
      return state.originalApprove()
    }

    alert('没有找到原审批函数，请刷新页面后重试。')
  }

  async function overrideAndMakeCover(){
    if(state.busy) return

    const jobId = getJobId()
    if(!jobId){
      alert('请先读取最新成片或填写 Job ID')
      return
    }

    let report
    try{
      report = await fetchReview(true)
    }catch(error){
      alert('读取审查状态失败：' + error.message)
      return
    }

    if(!report?.mechanical?.passed){
      alert(
        '机械检查未通过，不能按豆包误报处理。' +
        '请先修复音视频、尺寸、黑帧或文件问题。'
      )
      return
    }

    if(aiIssues(report).length === 0){
      alert('当前没有豆包问题提示，请使用普通“通过并生成3套9:16封面”。')
      return
    }

    const confirmed = confirm(
      '请确认你已经完整观看豆包提示对应的时间段，' +
      '并确认画面与口播实际匹配。\n\n' +
      '确认后会保留豆包原始意见、记录人工原因，' +
      '通过审查并生成9:16封面。'
    )
    if(!confirmed) return

    const note = prompt(
      '填写人工确认说明（至少4个字）',
      '已人工完整观看，画面与口播实际匹配，豆包提示属于误报'
    )
    if(note === null) return
    if(note.trim().length < 4){
      alert('人工确认说明至少填写4个字')
      return
    }

    const titleEl = byId('title')
    const keywordsEl = byId('keywords')
    const styleEl = byId('style')
    const ctaEl = byId('cta')

    state.busy = true
    updateButtons(report)

    try{
      const data = await api(
        `/api/video/review/${encodeURIComponent(jobId)}/human-override`,
        {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            reviewer: 'human',
            note: note.trim(),
            generate_cover: true,
            title: titleEl?.value || '',
            keywords: String(keywordsEl?.value || '')
              .split(/[,，\s]+/)
              .filter(Boolean),
            style: styleEl?.value || '专业顾问',
            cta: ctaEl?.value || ''
          })
        }
      )

      const updatedReport = normalizeReport(data)
      state.report = updatedReport
      updateButtons(updatedReport)

      try{
        if(typeof window.renderReview === 'function'){
          window.renderReview(updatedReport)
        }
      }catch(_){}

      try{
        if(data.cover_result && typeof window.render === 'function'){
          window.render(data.cover_result)
        }
      }catch(_){}

      try{
        if(typeof window.log === 'function'){
          window.log(data)
        }
      }catch(_){}

      alert(
        data.cover_result
          ? '已确认豆包误报，并生成9:16封面'
          : '已确认豆包误报并解锁包装；封面未完成，请查看页面日志'
      )
    }catch(error){
      alert('人工误报确认失败：' + error.message)
      try{
        if(typeof window.log === 'function'){
          window.log('人工误报确认失败：' + error.message)
        }
      }catch(_){}
    }finally{
      state.busy = false
      try{
        await fetchReview(true)
      }catch(_){
        updateButtons(state.report || {})
      }
    }
  }

  function bindButtons(){
    const approveBtn = byId('reviewApproveBtn')
    if(approveBtn){
      if(!state.originalApprove){
        state.originalApprove = window.approveVideoAndMakeCover
      }
      approveBtn.onclick = safeNormalApprove
      approveBtn.removeAttribute('onclick')
    }

    const overrideBtn = byId('reviewOverrideBtn')
    if(overrideBtn){
      overrideBtn.onclick = overrideAndMakeCover
      overrideBtn.removeAttribute('onclick')
    }
  }

  function boot(){
    hookRenderReview()
    bindButtons()
    updateButtons(state.report || {})

    setInterval(function(){
      hookRenderReview()
      bindButtons()
      fetchReview(false).catch(function(){})
    }, 1500)
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot, {once:true})
  }else{
    boot()
  }

  window.overrideVideoReviewAndMakeCover = overrideAndMakeCover
  window.safeApproveVideoAndMakeCover = safeNormalApprove
})()
</script>

  }
  setInterval(applyThreeCoverLabels, 1200)
})()
