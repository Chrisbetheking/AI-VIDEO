<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111b3f"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".12"/><stop offset="1" stop-color="#ffffff" stop-opacity=".05"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/></marker><style>.title{font:800 42px Arial,'Microsoft YaHei',sans-serif;fill:#fff}.sub{font:500 20px Arial,'Microsoft YaHei',sans-serif;fill:#b9c6dc}.box{fill:url(#card);stroke:#334155;stroke-width:2;rx:22}.h{font:800 22px Arial,'Microsoft YaHei',sans-serif;fill:#f8fafc}.t{font:500 17px Arial,'Microsoft YaHei',sans-serif;fill:#cbd5e1}.line{stroke:#7dd3fc;stroke-width:2.8;fill:none;marker-end:url(#arrow);opacity:.9}.chip{fill:#0ea5e9;fill-opacity:.18;stroke:#38bdf8;stroke-opacity:.55;rx:18}.chiptext{font:800 15px Arial,'Microsoft YaHei',sans-serif;fill:#bfdbfe}.num{font:900 34px Arial,'Microsoft YaHei',sans-serif;fill:#7dd3fc}</style></defs>
  <rect width="1500" height="920" rx="34" fill="url(#bg)"/>
  <text x="70" y="78" class="title">EduAgent｜前端 + AI 应用架构</text>
  <text x="70" y="116" class="sub">React / TypeScript 工作台 · RAG 检索 · SSE 流式输出 · 日志可观测 · Netlify + Render 部署</text>
  <rect x="70" y="165" width="280" height="150" class="box"/><text x="95" y="210" class="h">1. 前端入口</text><text x="95" y="246" class="t">Netlify 前端入口</text><text x="95" y="276" class="t">React 多页面工作台</text>
  <rect x="430" y="165" width="300" height="150" class="box"/><text x="455" y="210" class="h">2. 前端工程层</text><text x="455" y="246" class="t">路由拆分 / API 封装</text><text x="455" y="276" class="t">Loading / Error / 导出 / SSE</text>
  <rect x="810" y="165" width="290" height="150" class="box"/><text x="835" y="210" class="h">3. 后端服务</text><text x="835" y="246" class="t">Render + NestJS API</text><text x="835" y="276" class="t">JWT / DTO / 限流 / 日志</text>
  <rect x="1180" y="165" width="250" height="150" class="box"/><text x="1205" y="210" class="h">4. 模型能力</text><text x="1205" y="246" class="t">DeepSeek Chat</text><text x="1205" y="276" class="t">Prompt / 超时 / 备用结果</text>
  <path d="M350 240 H430" class="line"/><path d="M730 240 H810" class="line"/><path d="M1100 240 H1180" class="line"/>
  <rect x="70" y="405" width="320" height="190" class="box"/><text x="95" y="450" class="h">RAG 检索链路</text><text x="95" y="486" class="t">文档导入 → 自动切片</text><text x="95" y="516" class="t">Embedding → pgvector</text><text x="95" y="546" class="t">Top-K / 混合检索 / 来源引用</text>
  <rect x="450" y="405" width="320" height="190" class="box"/><text x="475" y="450" class="h">业务工具链</text><text x="475" y="486" class="t">申请案卷 / 材料清单</text><text x="475" y="516" class="t">客户线索 / 跟进话术</text><text x="475" y="546" class="t">weighted-fit 选校评分</text>
  <rect x="830" y="405" width="300" height="190" class="box"/><text x="855" y="450" class="h">质量闭环</text><text x="855" y="486" class="t">8 个 RAG 标准问题</text><text x="855" y="516" class="t">Hit@1 / Hit@3 / MRR / P95</text><text x="855" y="546" class="t">缓存命中 / 异常样本</text>
  <rect x="1190" y="405" width="240" height="190" class="box"/><text x="1215" y="450" class="h">展示与复盘</text><text x="1215" y="486" class="t">系统日志</text><text x="1215" y="516" class="t">requestId / 耗时</text><text x="1215" y="546" class="t">RAG 命中 / 工具路径</text>
  <path d="M230 315 V405" class="line"/><path d="M960 315 V405" class="line"/><path d="M390 500 H450" class="line"/><path d="M770 500 H830" class="line"/><path d="M1130 500 H1190" class="line"/>
  <rect x="110" y="690" width="260" height="90" class="chip"/><text x="135" y="724" class="chiptext">前端主线</text><text x="135" y="754" class="t">复杂表单 / 状态 / 流式 UI</text>
  <rect x="450" y="690" width="260" height="90" class="chip"/><text x="475" y="724" class="chiptext">AI 加分项</text><text x="475" y="754" class="t">RAG / Prompt / 评测</text>
  <rect x="790" y="690" width="260" height="90" class="chip"/><text x="815" y="724" class="chiptext">工程交付</text><text x="815" y="754" class="t">部署 / 日志 / 失败处理</text>
  <rect x="1130" y="690" width="260" height="90" class="chip"/><text x="1155" y="724" class="chiptext">可面试</text><text x="1155" y="754" class="t">Demo / 源码 / 指标闭环</text>
</svg>